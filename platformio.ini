; Prisma - calculadora grafica cientifica para o M5Stack Cardputer ADV
;
; Compilar:  pio run
; Gravar:    pio run -t upload        (ou o prisma-full.bin em 0x0 pelo ESP Web Flasher)
;
; Mesma plataforma e bibliotecas do Orbita (Arduino-ESP32 3.x via pioarduino).

[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
board_build.partitions = partitions.csv
board_build.flash_mode = dio
board_upload.flash_size = 8MB
board_upload.maximum_size = 3145728
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -O2
build_unflags = -Os
lib_deps =
    m5stack/M5Cardputer@^1.1.0
    m5stack/M5Unified@^0.2.8
    m5stack/M5GFX@^0.2.10
